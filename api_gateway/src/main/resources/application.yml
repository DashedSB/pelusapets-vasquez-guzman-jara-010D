server:
  port: 8080

jwt:
  secret: "493358340235739058340598340598340598340598340598"

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*" 
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://localhost:8082
          predicates:
            - Path=/auth/**
            
        - id: usuario-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/usuarios/**
          filters:
            - AuthenticationFilter
            
        - id: logistica-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/envios/**, /api/proveedores/**
          filters:
            - AuthenticationFilter

springdoc:
  swagger-ui:
    urls:
      - name: Servicio Usuarios e Identidad
        url: /api/usuarios/v3/api-docs
      - name: Servicio Logística
        url: /api/envios/v3/api-docs